# 호스트 nginx — /etc/nginx/sites-available/abyssblue (sites-enabled 에 심볼릭 링크)
#
#   sudo ln -s /etc/nginx/sites-available/abyssblue /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d abyssblue.co.kr -d www.abyssblue.co.kr
#
# ⚠ server_name 의 도메인은 실제 쓰는 주소로 바꿀 것 (아래는 예시).
# certbot 이 443 블록과 인증서 경로를 알아서 넣어 주므로, 이 파일은 80 만 적어 두면 된다.

server {
    listen 80;
    listen [::]:80;
    server_name abyssblue.co.kr www.abyssblue.co.kr;

    # 업로드 이미지 — 백엔드가 S3 로 리다이렉트하거나 직접 내려준다
    client_max_body_size 20m;

    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next 의 개발용 HMR 은 운영에 없지만, 스트리밍 응답을 위해 업그레이드는 넘겨 둔다
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
