# 호스트 nginx — /etc/nginx/sites-available/abyssblue (sites-enabled 에 심볼릭 링크)
#
#   sudo cp nginx-abyssblue.conf /etc/nginx/sites-available/abyssblue
#   sudo ln -sf /etc/nginx/sites-available/abyssblue /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d site-test001.shop -d www.site-test001.shop
#
# certbot 이 443 블록과 인증서 경로를 알아서 넣어 주므로 여기엔 80 만 적는다.
#
# 운영 도메인으로 옮길 때: 아래 server_name 두 군데를 바꾸고, .env 의 CORS_ORIGIN 도
# 같이 바꾼다(첫 항목이 소셜 로그인 후 돌아올 주소다). 그리고 certbot 을 다시 돌린다.
#   server_name  abyssblue.com www.abyssblue.com abyssblue.co.kr www.abyssblue.co.kr;

# www 는 그냥 넘긴다 — 쿠키와 CORS 기준 주소를 하나로 두기 위해서다.
# 두 주소를 다 받으면 www 에서 로그인한 쿠키가 비-www 에서 안 보인다.
server {
    listen 80;
    listen [::]:80;
    server_name www.site-test001.shop;
    return 301 https://site-test001.shop$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name site-test001.shop;

    # 글에 올리는 사진이 커서 기본값(1m)으로는 막힌다
    client_max_body_size 20m;

    # 백엔드 — API 와 업로드 이미지
    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트 (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 스트리밍 응답을 위해 업그레이드는 넘겨 둔다
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
