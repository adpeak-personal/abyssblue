# 참고용 — 이 파일을 sites-enabled 에 그대로 넣지 말 것.
#
# 이 서버(141.164.60.58)는 /etc/nginx/sites-enabled/default 한 파일에
# 여러 사이트(site-test001.shop, testby001.shop, atb.co.kr)가 들어 있다.
# 같은 server_name 을 가진 파일을 따로 넣으면 중복으로 nginx 가 뜨지 않는다.
# 바꿀 때는 default 안의 해당 블록을 고친다 (deploy/README.md 5번 참고).
#
# 아래는 2026-10-29 기준으로 default 에 실제로 들어가 있는 블록이다.
# 443/인증서 줄은 certbot 이 넣은 것이라 손대지 않는다.

server {
    server_name site-test001.shop www.site-test001.shop;
    client_max_body_size 20m;

    # www 는 비-www 로 넘긴다 — 로그인 쿠키와 CORS 기준 주소를 하나로 두기 위해서다
    if ($host = www.site-test001.shop) {
        return 301 https://site-test001.shop$request_uri;
    }

    # 전부 프론트로 넘긴다. /api 와 /uploads 는 Next 의 rewrite 가
    # 백엔드 컨테이너로 넘기므로(next.config.ts), nginx 에서 따로 가를 필요가 없다.
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/site-test001.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/site-test001.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
